  <title id="title">Prémeyzel, entre collines et pâturages</title>
  <desc id="desc">Les maisons de pierre de Prémeyzel, son église au clocher carré et son four à bois au pignon à redents. Deux montagnes boisées et arrondies encadrent le village. Des vaches et des moutons paissent dans les prés.</desc>
